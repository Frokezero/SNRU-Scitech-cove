<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เปลี่ยนรหัสผ่านใหม่ - ปฏิทินกิจกรรมนักศึกษา 2569</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="theme-loader.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; }

        .theme-toggle-fixed {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            z-index: 1000;
            transition: all 0.3s;
        }
        .theme-toggle-fixed:hover { background: rgba(255,255,255,0.3); }

        html.dark-theme .reset-card {
            background: #1e293b;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }
        html.dark-theme h1 { color: white; }
        html.dark-theme p { color: #94a3b8; }
        html.dark-theme label { color: #cbd5e1; }
        html.dark-theme input {
            background: #0f172a;
            color: white;
            border-color: #334155;
        }
        html.dark-theme .icon-box { background: rgba(255,255,255,0.05); color: #0ea5e9; }
        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f4c81 50%, #1e3a5f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .reset-card {
            background: white;
            border-radius: 24px;
            padding: 40px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .icon-box {
            width: 64px; height: 64px;
            background: #f0f9ff;
            color: #0284c7;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 20px;
        }
        h1 { font-size: 22px; color: #1e293b; margin-bottom: 8px; }
        p { font-size: 14px; color: #64748b; margin-bottom: 28px; }
        
        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: #334155; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        input {
            width: 100%;
            padding: 12px 12px 12px 42px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.2s;
        }
        input:focus { outline: none; border-color: #0284c7; box-shadow: 0 0 0 4px rgba(2,132,199,0.1); }
        
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover { background: #0369a1; transform: translateY(-1px); }
        .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
        
        #message { margin-top: 16px; font-size: 14px; padding: 10px; border-radius: 8px; display: none; }
        .error { display: block !important; background: #fef2f2; color: #dc2626; }
        .success { display: block !important; background: #f0fdf4; color: #16a34a; }
    </style>
</head>
<body>
    <button class="theme-toggle-fixed" onclick="toggleTheme()">
        <i id="theme-toggle-icon" class="fa-solid fa-moon"></i>
    </button>
    <div class="reset-card">
        <div class="icon-box"><i class="fa-solid fa-key"></i></div>
        <h1>เปลี่ยนรหัสผ่านใหม่</h1>
        <p id="sub-title">กำหนดรหัสผ่านใหม่สำหรับบัญชีของคุณ</p>
        
        <div id="reset-form">
            <div class="form-group">
                <label>รหัสผ่านใหม่</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="new-password" placeholder="อย่างน้อย 6 ตัวอักษร">
                </div>
            </div>
            <div class="form-group">
                <label>ยืนยันรหัสผ่านใหม่</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-shield-check"></i>
                    <input type="password" id="confirm-password" placeholder="กรอกรหัสผ่านอีกครั้ง">
                </div>
            </div>
            <button class="btn-submit" onclick="doReset()" id="submit-btn">ยืนยันการเปลี่ยนรหัส</button>
        </div>
        
        <div id="message"></div>
        
        <div style="margin-top: 24px;">
            <a href="/login" style="color:#0284c7; text-decoration:none; font-size:14px; font-weight:500;">
                <i class="fa-solid fa-arrow-left"></i> กลับไปหน้าเข้าสู่ระบบ
            </a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('reset-form').style.display = 'none';
            showMessage('ลิงก์ไม่ถูกต้องหรือหมดอายุ', 'error');
        }

        function showMessage(text, type) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = type;
        }

        async function doReset() {
            const newPw = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;
            
            if (newPw.length < 6) {
                showMessage('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร', 'error');
                return;
            }
            if (newPw !== confirm) {
                showMessage('รหัสผ่านไม่ตรงกัน', 'error');
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'กำลังบันทึก...';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ token: token, newPassword: newPw })
                });
                const data = await res.json();
                if (data.success) {
                    showMessage('✓ เปลี่ยนรหัสผ่านสำเร็จแล้ว! กำลังพากลับไปหน้า Login...', 'success');
                    document.getElementById('reset-form').style.display = 'none';
                    setTimeout(() => window.location.href = '/login', 2500);
                } else {
                    showMessage(data.message || 'เกิดข้อผิดพลาด', 'error');
                    btn.disabled = false;
                    btn.textContent = 'ยืนยันการเปลี่ยนรหัส';
                }
            } catch(e) {
                showMessage('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
                btn.disabled = false;
                btn.textContent = 'ยืนยันการเปลี่ยนรหัส';
            }
        }
    </script>
</body>
</html>
