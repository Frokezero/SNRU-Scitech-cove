<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลส่วนตัว - ปฏิทินกิจกรรมนักศึกษา 2569</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="chatbot.css">
    <script src="theme-loader.js"></script>
    <script src="ui-shared.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; }

        body {
            background: #f1f5f9;
            color: #334155;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        html.dark-theme body {
            background: #0f172a;
            color: #f8fafc;
        }
        html.dark-theme .card {
            background: #1e293b;
            color: #f8fafc;
            border-color: #334155;
        }
        html.dark-theme .form-group label { color: #cbd5e1; }
        html.dark-theme input, html.dark-theme select {
            background: #0f172a;
            color: white;
            border-color: #334155;
        }
        html.dark-theme .info-read-only {
            background: #0f172a;
            border-color: #334155;
            color: #94a3b8;
        }

        /* Top nav bar */
        .top-nav {
            background: linear-gradient(135deg, #1e293b, #0f4c81);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
        }
        .top-nav .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
        }
        .top-nav .nav-brand .nav-logo {
            background: white;
            width: 50px; height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .top-nav .nav-brand .nav-logo img {
            width: 100%; height: 100%; object-fit: contain; padding: 4px;
        }
        .nav-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .btn-nav {
            padding: 7px 15px;
            border-radius: 8px;
            border: none;
            font-family: 'Kanit', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-ghost { background: rgba(255,255,255,0.12); color: white; }
        .btn-ghost:hover { background: rgba(255,255,255,0.22); }
        .btn-active { background: #0284c7; color: white; }

        /* Main layout */
        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 28px 20px 60px;
        }

        /* Profile Hero Card */
        .profile-hero {
            background: linear-gradient(135deg, #1e293b 0%, #0f4c81 100%);
            border-radius: 20px;
            padding: 28px;
            color: white;
            margin-bottom: 22px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(15, 76, 129, 0.2);
        }
        .profile-hero::before {
            content: '';
            position: absolute;
            top: -60px; right: -60px;
            width: 220px; height: 220px;
            background: rgba(250,204,21,0.12);
            border-radius: 50%;
        }
        .profile-hero-top {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .avatar {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            box-shadow: 0 4px 16px rgba(2, 132, 199, 0.4);
            flex-shrink: 0;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .profile-name { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .profile-meta { font-size: 13px; opacity: 0.85; margin-bottom: 2px; }

        /* Card */
        .card {
            background: white;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 20px;
            overflow: hidden;
        }
        .card-header {
            padding: 18px 22px;
            border-bottom: 1px solid #f1f5f9;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #1e293b;
            font-size: 15px;
        }
        html.dark-theme .card-header { color: #f8fafc; border-color: #334155; }
        .icon-circle {
            width: 34px; height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }
        .card-body { padding: 22px; }

        /* Form */
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }
        input {
            width: 100%;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1.5px solid #cbd5e1;
            font-family: inherit;
            font-size: 14px;
            background: #fff;
            color: #1e293b;
            outline: none;
            transition: all 0.2s;
        }
        input:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2,132,199,0.1); }
        .info-read-only {
            background: #f8fafc;
            color: #64748b;
            cursor: not-allowed;
            border-color: #e2e8f0;
        }

        .btn-submit-work {
            width: 100%;
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(2,132,199,0.25);
        }
        .btn-submit-work:hover { background: #0369a1; transform: translateY(-1px); }
        .btn-submit-work:active { transform: translateY(0); }

        .qr-container {
            background: #f8fafc;
            border-color: #e2e8f0;
        }
        html.dark-theme .qr-container {
            background: rgba(15, 23, 42, 0.3) !important;
            border-color: #334155 !important;
        }

        /* Notification Toast */
        #msg-toast {
            position: fixed;
            bottom: 24px; right: 24px;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 1000;
            display: none;
            align-items: center;
            gap: 8px;
            animation: slideInRight 0.3s ease;
        }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        #msg-toast.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; display: flex; }
        #msg-toast.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; display: flex; }
        #msg-toast.loading { background: #eff6ff; color: #0284c7; border: 1px solid #bfdbfe; display: flex; }

        @media (max-width: 768px) {
            .top-nav { flex-direction: column; gap: 12px; padding: 12px; }
            .nav-actions { width: 100%; justify-content: space-between; flex-wrap: wrap; }
            .btn-nav { flex: 1; text-align: center; justify-content: center; padding: 10px 8px; font-size: 12px; }
            .profile-hero-top { flex-direction: column; text-align: center; }
            .avatar { margin: 0 auto; }
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a href="/" class="nav-brand">
            <div class="nav-logo"><img src="static/img/scitech_logo.png" alt="SciTech Logo"></div>
            ข้อมูลส่วนตัวนักศึกษา
        </a>
        <div class="nav-actions">
            <a href="/" class="btn-nav btn-ghost"><i class="fa-solid fa-house"></i> ปฏิทิน</a>
            <a href="/profile" class="btn-nav btn-ghost"><i class="fa-solid fa-clock-rotate-left"></i> ประวัติกิจกรรม</a>
            <a href="/user-info" class="btn-nav btn-active"><i class="fa-solid fa-id-card"></i> ข้อมูลส่วนตัว</a>
            <button class="btn-nav btn-ghost" onclick="toggleTheme()" title="เปลี่ยนธีม">
                <i id="theme-toggle-icon" class="fa-solid fa-moon"></i>
            </button>
            <button class="btn-nav" onclick="doLogout()" style="background:rgba(220,38,38,0.15);color:#fca5a5;">
                <i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ
            </button>
        </div>
    </nav>

    <div class="container">
        <!-- Hero Header -->
        <div class="profile-hero">
            <div class="profile-hero-top">
                <div class="avatar">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <div class="profile-name" id="user-name">กำลังโหลดข้อมูล...</div>
                    <div style="display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px;">
                        <div class="profile-meta"><i class="fa-solid fa-id-card-clip" style="color: #facc15;"></i> <span id="user-id">-</span></div>
                        <div class="profile-meta"><i class="fa-solid fa-graduation-cap" style="color: #facc15;"></i> <span id="user-major">-</span></div>
                        <div class="profile-meta"><i class="fa-solid fa-calendar-user" style="color: #facc15;"></i> <span id="user-year">-</span></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 1. General & Contact Info Card -->
        <div class="card">
            <div class="card-header">
                <div class="icon-circle" style="background:#f0f9ff; color:#0284c7;">
                    <i class="fa-solid fa-user-gear"></i>
                </div>
                ข้อมูลส่วนตัวและช่องทางติดต่อ
            </div>
            <div class="card-body">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 16px;">
                    <div class="form-group" style="margin-bottom:0;">
                        <label>ชื่อ-นามสกุล</label>
                        <input type="text" id="profile-fullname-display" class="info-read-only" readonly>
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label>รหัสนักศึกษา / Username</label>
                        <input type="text" id="profile-username-display" class="info-read-only" readonly>
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label>สาขาวิชา</label>
                        <input type="text" id="profile-major-display" class="info-read-only" readonly>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 16px;">
                    <label><i class="fa-solid fa-envelope" style="color:#0284c7; margin-right:4px;"></i> อีเมลนักศึกษา (สำหรับรับแจ้งเตือนและกู้คืนรหัสผ่าน)</label>
                    <input type="email" id="profile-email" placeholder="example@snru.ac.th">
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label><i class="fa-brands fa-line" style="color:#06c755; margin-right:4px;"></i> LINE User ID (สำหรับรับแจ้งเตือนสิทธิ์และผลกิจกรรม)</label>
                    <div style="display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap;">
                        <div style="flex: 1; min-width: 250px;">
                            <input type="text" id="profile-line-id" placeholder="Uxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" style="margin-bottom: 8px;">
                            <span style="font-size:11px; color:#94a3b8; display:block; line-height: 1.4;">💡 <b>วิธีรับ ID ของคุณ:</b> สแกน QR Code เพื่อแอดไลน์บอทระบบ หรือแอดไอดี <b>@614eqrhw</b> จากนั้นพิมพ์คำสั่ง <b>/myid</b> ในแชทบอท แล้วนำรหัสมาบันทึกในช่องนี้ครับ</span>
                        </div>
                        <div class="qr-container" style="display: flex; flex-direction: column; align-items: center; padding: 12px; border-radius: 12px; border-width: 1px; border-style: solid; width: 140px; text-align: center; flex-shrink: 0;">
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=110x110&data=https://line.me/R/ti/p/%40614eqrhw" alt="LINE Bot QR Code" style="width: 110px; height: 110px; border-radius: 6px; border: 1px solid #e2e8f0; background: white;">
                            <span style="font-size: 10px; font-weight: 600; color: #64748b; margin-top: 8px; display: block;"><i class="fa-brands fa-line" style="color: #06c755; margin-right: 2px;"></i> สแกนแอดไลน์บอท</span>
                        </div>
                    </div>
                </div>

                <button class="btn-submit-work" style="background:#16a34a;" onclick="updateProfileInfo()">
                    <i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูลส่วนตัวและติดต่อ
                </button>
            </div>
        </div>

        <!-- 2. Security & Change Password Card -->
        <div class="card">
            <div class="card-header">
                <div class="icon-circle" style="background:#fef2f2; color:#ef4444;">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                ความปลอดภัย (เปลี่ยนรหัสผ่าน)
            </div>
            <div class="card-body">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 18px;">
                    <div class="form-group" style="margin-bottom:0;">
                        <label>รหัสผ่านปัจจุบัน</label>
                        <input type="password" id="cp-current" placeholder="••••••••">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label>รหัสผ่านใหม่</label>
                        <input type="password" id="cp-new" placeholder="••••••••">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label>ยืนยันรหัสผ่านใหม่</label>
                        <input type="password" id="cp-confirm" placeholder="••••••••">
                    </div>
                </div>
                <button class="btn-submit-work" style="background:#1e293b;" onclick="changePassword()">
                    <i class="fa-solid fa-key"></i> บันทึกรหัสผ่านใหม่
                </button>
            </div>
        </div>
    </div>

    <div id="msg-toast"></div>

    <script>
        function showToast(text, type) {
            const el = document.getElementById('msg-toast');
            el.innerHTML = text;
            el.className = type;
            setTimeout(() => { el.className = ''; el.style.display = 'none'; }, 3500);
        }

        async function loadUserData() {
            try {
                const res = await fetch('/api/me');
                const data = await res.json();
                if (!data.success) {
                    window.location.href = '/login';
                    return;
                }
                const u = data.user;
                document.getElementById('user-name').textContent = u.name || u.username;
                document.getElementById('user-id').textContent = 'รหัส: ' + u.username;
                document.getElementById('user-major').textContent = u.major || 'ไม่ระบุ';
                document.getElementById('user-year').textContent = u.year ? 'ชั้นปีที่ ' + u.year : 'นักศึกษา';

                document.getElementById('profile-fullname-display').value = u.name || '';
                document.getElementById('profile-username-display').value = u.username || '';
                document.getElementById('profile-major-display').value = u.major || '';

                document.getElementById('profile-email').value = u.email || '';
                document.getElementById('profile-line-id').value = u.line_id || '';
            } catch (e) {
                console.error('Failed to load user data:', e);
            }
        }

        async function updateProfileInfo() {
            const email = document.getElementById('profile-email').value.trim();
            const lineId = document.getElementById('profile-line-id').value.trim();

            if (email && (!email.includes('@') || !email.includes('.'))) {
                showToast('<i class="fa-solid fa-triangle-exclamation"></i> รูปแบบอีเมลไม่ถูกต้อง', 'error');
                return;
            }

            showToast('<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึกข้อมูล...', 'loading');
            try {
                const res = await fetch('/api/user/update-profile', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: email, line_id: lineId })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('<i class="fa-solid fa-circle-check"></i> บันทึกข้อมูลส่วนตัวเรียบร้อยแล้ว!', 'success');
                } else {
                    showToast('<i class="fa-solid fa-circle-xmark"></i> ' + (data.message || 'เกิดข้อผิดพลาด'), 'error');
                }
            } catch (e) {
                showToast('<i class="fa-solid fa-circle-xmark"></i> ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
            }
        }

        async function changePassword() {
            const current = document.getElementById('cp-current').value;
            const newPw = document.getElementById('cp-new').value;
            const confirm = document.getElementById('cp-confirm').value;

            if (!current || !newPw || !confirm) {
                showToast('<i class="fa-solid fa-triangle-exclamation"></i> กรุณากรอกรหัสผ่านให้ครบทุกช่อง', 'error');
                return;
            }
            if (newPw.length < 6) {
                showToast('<i class="fa-solid fa-triangle-exclamation"></i> รหัสผ่านใหม่ต้องมีอย่างน้อย 6 ตัวอักษร', 'error');
                return;
            }
            if (newPw !== confirm) {
                showToast('<i class="fa-solid fa-triangle-exclamation"></i> รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน', 'error');
                return;
            }

            showToast('<i class="fa-solid fa-spinner fa-spin"></i> กำลังเปลี่ยนรหัสผ่าน...', 'loading');
            try {
                const res = await fetch('/api/user/change-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ currentPassword: current, newPassword: newPw })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('<i class="fa-solid fa-circle-check"></i> เปลี่ยนรหัสผ่านสำเร็จ!', 'success');
                    document.getElementById('cp-current').value = '';
                    document.getElementById('cp-new').value = '';
                    document.getElementById('cp-confirm').value = '';
                } else {
                    showToast('<i class="fa-solid fa-circle-xmark"></i> ' + (data.message || 'รหัสผ่านเดิมไม่ถูกต้อง'), 'error');
                }
            } catch (e) {
                showToast('<i class="fa-solid fa-circle-xmark"></i> เกิดข้อผิดพลาดในการเชื่อมต่อ', 'error');
            }
        }

        async function doLogout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
                window.location.href = '/login';
            } catch(e) {
                window.location.href = '/login';
            }
        }

        loadUserData();
    </script>
</body>
</html>
