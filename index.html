<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ปฏิทินกิจกรรมนักศึกษา 2569</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="notebook" style="position: relative;">
        <div id="user-controls" style="position: absolute; top: 15px; right: 20px; z-index: 100;">
            <!-- JS will inject login/logout buttons here -->
        </div>
        <header class="notebook-header">
            <div class="binding-area" id="binding-area">
                <!-- JS will inject rings -->
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 20px;">
                <div>
                    <div class="header-title">
                        <h1>ปฏิทิน</h1>
                        <h2>กิจกรรมนักศึกษา</h2>
                        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                            <div class="year">2569</div>
                            <button onclick="openPublicLeaderboard()" style="background:#f59e0b; color:white; border:none; padding: 8px 15px; border-radius: 20px; font-weight: bold; font-family: 'Kanit'; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 14px; box-shadow: 0 4px 6px -1px rgba(245, 158, 11, 0.4); transition: transform 0.2s;">
                                <i class="fa-solid fa-trophy"></i> Leaderboard
                            </button>
                        </div>
                    </div>
                    <div class="header-subtitle">
                        คณะวิทยาศาสตร์และเทคโนโลยี มหาวิทยาลัยราชภัฏสกลนคร
                    </div>
                    <!-- Leaderboard Ticker -->
                    <div id="leaderboard-ticker" style="margin-top: 15px; background: rgba(245, 158, 11, 0.1); border-left: 4px solid #f59e0b; padding: 8px 15px; border-radius: 4px; display: none; align-items: center; gap: 10px; min-width: 250px; max-width: 100%; animation: fadeIn 0.5s ease-out;">
                        <span style="color: #f59e0b; font-weight: bold; font-size: 14px;"><i class="fa-solid fa-star-burst"></i> Top Star:</span>
                        <div id="ticker-content" style="font-size: 14px; color: #334155; font-weight: 500; transition: all 0.5s;">
                            <!-- Will cycle through Top 10 -->
                        </div>
                    </div>
                </div>
                
                <div class="carousel-container" id="carousel-container">
                    <div class="carousel-track" id="carousel-track">
                        <!-- JS will inject images -->
                    </div>
                </div>
            </div>
        </header>

        <div class="filter-section">
            <div class="filter-label"><i class="fa-solid fa-calendar-days"></i> เลือกเดือน:</div>
            <div class="month-filters" id="month-filters">
                <!-- JS will inject month buttons dynamically -->
            </div>
        </div>

        <div class="filter-section">
            <div class="filter-label"><i class="fa-solid fa-graduation-cap"></i> เลือกสาขา/คณะ:</div>
            <div class="branch-filters" id="branch-filters">
                <!-- JS will inject branch buttons dynamically -->
            </div>
        </div>

        <main class="cards-container" id="cards-container">
            <!-- JS will inject cards here -->
        </main>

        <footer class="footer-bar">
            Faculty of Science and Technology, Sakon Nakhon Rajabhat University
            <div style="margin-top:5px; font-size:12px;">
                <a href="/admin" style="color:white; text-decoration:underline;">เข้าสู่ระบบจัดการ (Admin/Major)</a>
            </div>
        </footer>
    </div>

    <!-- Public Leaderboard Modal -->
    <div id="public-leaderboard-modal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; font-family: 'Kanit', sans-serif;">
        <div style="position: relative; max-width: 500px; width: 95%; margin: auto;">
            
            <!-- Close Button -->
            <button onclick="closePublicLeaderboard()" style="position: absolute; top: -15px; right: -15px; width: 45px; height: 45px; border-radius: 50%; background: #f59e0b; border: 4px solid #b45309; color: white; font-size: 24px; font-weight: bold; cursor: pointer; z-index: 1001; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <!-- Main Content Box -->
            <div style="background: #fdf3cd; border: 8px solid #8b5a2b; border-radius: 25px; padding: 40px 20px 20px 20px; position: relative; max-height: 80vh; overflow-y: auto; box-shadow: inset 0 0 20px rgba(139, 90, 43, 0.2), 0 10px 25px rgba(0,0,0,0.5);">
                
                <!-- Title Pill -->
                <div style="position: absolute; top: -30px; left: 50%; transform: translateX(-50%); background: linear-gradient(to bottom, #fbbf24, #f59e0b); border: 5px solid #b45309; border-radius: 40px; padding: 12px 60px; color: white; font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 6px 12px rgba(0,0,0,0.4); white-space: nowrap; z-index: 20; display: flex; align-items: center; justify-content: center; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">
                    LEADER BOARD
                </div>
                
                <div id="public-leaderboard-list" style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
                    <div style="text-align: center; color: #8b5a2b; font-weight: bold; padding: 20px;">กำลังโหลด...</div>
                </div>

            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
